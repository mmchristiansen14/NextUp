<!DOCTYPE html>
<html lang="en">

<head>
    <div class="logo">
        <span class="logo-letter letter-n">N</span>
        <span class="logo-letter letter-e">E</span>
        <span class="logo-letter letter-x">X</span>
        <span class="logo-letter letter-t">T</span>
        <span class="logo-letter letter-u">U</span>
        <span class="logo-letter letter-p">P</span>
    </div>

    <!-- connects style to page where rel is relationship and href is path to file-->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="next-task-display">

        <div class="selected-task">

            <h2>This task is NEXTUP:</h2>

            <div id="selected-display">
                Nothing selected yet
            </div>

        </div>

        <div id="next-task">
            <!-- creates a button (doesn't give it function) but id gives it a name -->
            <button id="generate-button">Generate Task</button>
        </div>
    </section>

    <section class="row2">
        <section class="add-task">

            <h2>Add a Task</h2>

            <div class="group-container">

                <!-- the hypenated select creates the dropdown -->
                <select id="group-select">

                    <option value="">
                        Select a Group
                    </option>

                </select>

            </div>

            <!-- the hyphenated input creates the textbox-->
            <input id="task-input" placeholder="Input task">

            <p1>Choose weight:</p1>

            <div class="star-selector">

                <span class="star" data-value="1">☆</span>
                <span class="star" data-value="2">☆</span>
                <span class="star" data-value="3">☆</span>
                <span class="star" data-value="4">☆</span>
                <span class="star" data-value="5">☆</span>

            </div>

            <button id="add-button">
                Add Task
            </button>

        </section>

        <div class="groups-box">

            <h2>Groups</h2>

            <div id="groups-container">
            </div>

            <div id="group-box-column">
            </div>

            <button id="new-group-button">
                + New Group
            </button>

        </div>
    </section>


    <!--creates containers for information as columns-->
    <div class="task-board">

        <div id="checkbox-column">
        </div>

        <!-- this is my headers column and these are empty group placeholders-->
        <div id="group-column">
        </div>

        <div id="task-column">
        </div>

        <div id="edit-column">
        </div>

        <div id="delete-column">
        </div>

    </div>

    <div id="group-popup">

        <div class="popup-content">

            <button id="close-popup">✕</button>

            <h2>Create New Group</h2>

            <input id="new-group-name" placeholder="Group Name">

            <div class="group-star-selector">

                <p>Weight:</p>

                <span class="group-star" data-value="1">☆</span>
                <span class="group-star" data-value="2">☆</span>
                <span class="group-star" data-value="3">☆</span>
                <span class="group-star" data-value="4">☆</span>
                <span class="group-star" data-value="5">☆</span>

            </div>

            <h3>Choose a Color</h3>

            <div class="color-palette">
                <div class="color-circle blue" data-color="#B8C9C5"></div>
                <div class="color-circle green" data-color="#C8D09F"></div>

                <div class="color-circle purple" data-color="#D2B8C4"></div>

                <div class="color-circle yellow" data-color="#D9B47A"></div>

                <div class="color-circle red" data-color="#C34F55"></div>

                <div class="color-circle orange" data-color="#D27A42"></div>
            </div>

            <button id="create-group-button">
                Create Group
            </button>

        </div>

    </div>

    <script src="script.js"> </script>
</body>

</html>
